plugins { id 'com.android.application' }
if (file('google-services.json').exists()) { apply plugin: 'com.google.gms.google-services' }

android {
    namespace 'br.com.falai'
    compileSdk 36
    defaultConfig {
        applicationId 'br.com.falai'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'WORKER_URL', '"https://falai-notificacoes.robraym-studio.workers.dev"'
        // Embedded in the binary; never infer this date from install time or registration time.
        buildConfigField 'long', 'APK_BUILD_TIME', "${System.currentTimeMillis()}L"
        if (!file('google-services.json').exists()) { resValue 'string', 'default_web_client_id', '' }
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.work:work-runtime:2.10.1'
    // Worker's Java API exposes ListenableFuture; Firebase only exports Guava at runtime.
    implementation 'com.google.guava:guava:33.4.8-android'
    implementation platform('com.google.firebase:firebase-bom:34.6.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    debugImplementation 'com.google.firebase:firebase-appcheck-debug'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    testImplementation 'junit:junit:4.13.2'
}
