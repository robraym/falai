plugins { id 'com.android.application' }
if (file('google-services.json').exists()) { apply plugin: 'com.google.gms.google-services' }

// Reserve the old sequential codes for existing APKs. New codes grow with UTC build time.
def apkBuildEpochSeconds = 1577836800L
def apkFirstDatedCode = 100000000
def apkVersionCode = Math.floorDiv(System.currentTimeMillis(), 1000L) - apkBuildEpochSeconds
if (apkVersionCode < apkFirstDatedCode || apkVersionCode > Integer.MAX_VALUE) {
    throw new GradleException('A data deste computador está fora do intervalo de versionCode do APK.')
}

def publishScript = rootProject.file('scripts/publish-update.ps1')
def checkPublishLogin = tasks.register('verificarLoginPublicacao', Exec) {
    group = 'publicacao'
    description = 'Confere o login do GitHub sem publicar nem gerar APK.'
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', publishScript.absolutePath, '-CheckOnly'
}
tasks.matching { it.name == 'assembleRelease' }.configureEach { mustRunAfter(checkPublishLogin) }
tasks.register('publicarAtualizacao', Exec) {
    group = 'publicacao'
    description = 'Gera Falai.apk e publica a atualização no GitHub Releases.'
    dependsOn checkPublishLogin, 'assembleRelease'
    environment 'JAVA_HOME', System.getProperty('java.home')
    doFirst {
        if (!file('google-services.json').exists()) {
            throw new GradleException('Adicione app/google-services.json antes de publicar o Falai.')
        }
    }
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', publishScript.absolutePath,
        '-Metadata', layout.buildDirectory.file('outputs/apk/release/output-metadata.json').get().asFile.absolutePath,
        '-Aapt', new File(android.sdkDirectory, "build-tools/${android.buildToolsVersion}/aapt.exe").absolutePath,
        '-ApkSigner', new File(android.sdkDirectory, "build-tools/${android.buildToolsVersion}/apksigner.bat").absolutePath
}

android {
    namespace 'br.com.falai'
    compileSdk 36
    defaultConfig {
        applicationId 'br.com.falai'
        minSdk 24
        targetSdk 36
        versionCode(apkVersionCode.intValue())
        // Public versions use major.minor only (for example, 1.2 or 1.3).
        versionName '2.0'
        buildConfigField 'long', 'APK_BUILD_EPOCH_SECONDS', "${apkBuildEpochSeconds}L"
        buildConfigField 'int', 'APK_FIRST_DATED_CODE', "${apkFirstDatedCode}"
        buildConfigField 'String', 'WORKER_URL', '"https://falai-notificacoes.robraym-studio.workers.dev"'
        if (!file('google-services.json').exists()) { resValue 'string', 'default_web_client_id', '' }
    }
    buildFeatures { buildConfig true }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = 'Falai.apk'
        }
    }
    buildTypes {
        release {
            // Keep the installed certificate: changing keys would prevent in-place updates.
            // This is a non-debuggable release build, signed with the existing local key.
            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.work:work-runtime:2.10.1'
    // Worker's Java API exposes ListenableFuture; Firebase only exports Guava at runtime.
    implementation 'com.google.guava:guava:33.7.2-android'
    implementation platform('com.google.firebase:firebase-bom:34.6.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    debugImplementation 'com.google.firebase:firebase-appcheck-debug'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    testImplementation 'junit:junit:4.13.2'
}
